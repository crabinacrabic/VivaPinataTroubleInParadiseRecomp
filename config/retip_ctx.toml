# Register localization flags (keys per rex/codegen/config.h, SDK 0.10).
#
# First boot on SDK 0.10: everything at SDK defaults (all false), the setting
# that runs Viva Pinata (4D5307F2) on this SDK. The 0.8.1 fork build used the
# faster values in the trailing comments; turn them back on ONE AT A TIME once
# the garden works, with a full smoke test after each.
skip_lr = false                  # fork: true
skip_msr = false                 # fork: true
ctr_as_local = false             # fork: true
xer_as_local = false             # fork: true
cr_as_local = false              # fork: true
reserved_as_local = false        # fork: true
non_argument_as_local = false
non_volatile_as_local = false
generate_exception_handlers = false

[analysis]
max_jump_extension = 65536
data_region_threshold = 16
large_function_threshold = 1048576

