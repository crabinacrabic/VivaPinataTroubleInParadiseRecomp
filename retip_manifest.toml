# retip - Viva Pinata: Trouble in Paradise (World), Xbox 360
#
# Configured for ReXGlue SDK 0.10.0.8-dev.g1406e1b.

[project]
name = "retip"
sdk_version = "0.10.0"
game_root = "assets"

[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated/default"
setjmp_address = 0x82AE2EA0
longjmp_address = 0x82AE2A60
includes = [
    "config/retip_ctx.toml",     # register localization flags + [functions] boundary fixes
    "config/retip_hooks.toml",   # [functions] with `name` -> rex_* symbols used by src/
    "config/retip_midasm.toml",  # [[midasm_hook]] (24 hooks, host functions in src/)
    "config/retip_crt.toml",     # [rexcrt] native CRT offloading (heap + file I/O)
]
